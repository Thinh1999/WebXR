<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>HW4 WebXR AR</title>
    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
</head>
<body>
    <a-scene webxr="optionalFeatures: hit-test;" ar-hit-test="target:#ghe;">
        <a-entity id="ghe" visible="true">
            <a-box position="0 0.22 0" width="0.4" height="0.04" depth="0.4" color="#8B5A2B"></a-box>
            <a-box color="#5C3A1E" width="0.04" height="0.2" depth="0.04"
                   position="-0.16 0.1 -0.16"></a-box>
            <a-box color="#5C3A1E" width="0.04" height="0.2" depth="0.04"
                   position="0.16 0.1 -0.16"></a-box>
            <a-box color="#5C3A1E" width="0.04" height="0.2" depth="0.04"
                   position="-0.16 0.1 0.16"></a-box>
            <a-box color="#5C3A1E" width="0.04" height="0.2" depth="0.04"
                   position="0.16 0.1 0.16"></a-box>
        </a-entity>
    </a-scene>
</body>
</html>
